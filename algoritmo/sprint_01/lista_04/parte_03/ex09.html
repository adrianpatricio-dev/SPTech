<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMC</title>
</head>
<body>
    <h3>Índice de Massa Corporal (IMC)</h3>

    <label for="ipt_peso">Peso (kg)</label> <br>
    <input type="text" id="ipt_peso"> <br>

    <label for="ipt_altura">Altura (m)</label> <br>
    <input type="text" id="ipt_altura"> <br><br>

    <button onclick="calcularIMC()">CALCULAR IMC</button> <br><br>

    <span id="msg"></span>
</body>
</html>

<script>
    function calcularIMC() {
        let peso = Number(ipt_peso.value);
        let altura = Number(ipt_altura.value);
        
        let imc = peso / (altura * altura);

        if (imc < 18.5) {
            msg.innerHTML = `Abaixo do peso`;
        } else if (imc < 25) {
            msg.innerHTML = `Peso normal`;
        } else if (imc <= 29.9) {
            msg.innerHTML = `Acima do peso`;
        } else {
            msg.innerHTML = `Cuidado, risco de obesidade`;
        }
    }
</script>
