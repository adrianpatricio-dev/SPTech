<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Caracteres</title>
</head>
<body>
    <label for="ipt_frase">Digite uma frase</label> <br>
    <input type="text" id="ipt_frase"> <br><br>

    <button onclick="analisarFrase()">ANALISAR FRASE</button> <br><br>

    <span id="msg"></span>
</body>
</html>

<script>
    function analisarFrase() {
        let frase = ipt_frase.value;

        let tamanho = frase.length;

        msg.innerHTML = `Tamanho da Frase: ${tamanho}`;

        if (tamanho < 10) {
            msg.innerHTML += `<p style="color: red;">Frase curta!</p>`;
        } else {
            msg.innerHTML += `<p style="color: blue;">Frase longa!</p>`;
        }
    }
</script>
