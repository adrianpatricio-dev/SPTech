<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmes em Cores: Azul e Vermelho Alternados</title>
</head>
<body>
    <h3>Filmes em Cores: Azul e Vermelho Alternados</h3>

    <label for="ipt_filmes">Digite os filmes</label> <br>
    <input type="text" id="ipt_filmes"> <br><br>

    <button onclick="cadastrarFilme()">CADASTRAR FILME</button> <br><br>

    <span id="msg"></span>
</body>
</html>

<script>
    let lista = [];

    function cadastrarFilme() {
        let filmes = ipt_filmes.value;

        let tamanho = lista.length;

        ipt_filmes.value = '';
        ipt_filmes.focus();

        lista.push(filmes);

        if (tamanho % 2 == 0) {
            msg.innerHTML += `<span style="color: blue">${filmes}</span><br>`;
        } else {
            msg.innerHTML += `<span style="color: red">${filmes}</span><br>`;
        }
    }
</script>
