<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alugueis pagos com pedras de ouro</title>
</head>
<body>
    <h3>Alugueis pagos com pedras de ouro</h3>

    <label for="ipt_quantidade_dinheiro">Quanto tem guardado no banco?</label> <br>
    <input type="text" id="ipt_quantidade_dinheiro"> <br>

    <label for="ipt_quantidade_pedras">Quantas pedras de ouro possui?</label> <br>
    <input type="text" id="ipt_quantidade_pedras"> <br>

    <label for="ipt_valor_aluguel">Qual o valor do aluguel?</label> <br>
    <input type="text" id="ipt_valor_aluguel"> <br>

    <label for="ipt_meses_aluguel">Quantos meses de aluguel serão pagos?</label> <br>
    <input type="text" id="ipt_meses_aluguel"> <br>

    <label for="ipt_anos_vida">Quantos anos pretende viver?</label> <br>
    <input type="text" id="ipt_anos_vida"> <br><br>

    <button onclick="calcular()">CALCULAR</button> <br><br>

    <span id="msg"></span>
</body>
</html>

<script>
    function calcular() {
        let dinheiro = Number(ipt_quantidade_dinheiro.value);
        let quantidade_pedras = Number(ipt_quantidade_pedras.value);
        let valor_aluguel = Number(ipt_valor_aluguel.value);
        let meses_aluguel = Number(ipt_meses_aluguel.value);
        let anos_vida = Number(ipt_anos_vida.value);

        let indice_anos = 1;
        let indice_meses = 1;

        let saldo_inicial = 0;
        let pedras = quantidade_pedras;
        let valor_uma_pedra = 10000;
        let quantidade_total_pedras = quantidade_pedras;
        let quantidade_dinheiro = dinheiro;
        let meses_pagos = 0;
        let faliu = false;

        let mensagem = '';

        while (indice_anos <= anos_vida && faliu == false) {
            let indice_meses = 1;

            mensagem += `<br>...<br>Ano - 0${indice_anos}<br>`;

            while (indice_meses <= meses_aluguel && faliu == false) {
                saldo_inicial = quantidade_dinheiro;

                if (quantidade_dinheiro < valor_aluguel && quantidade_total_pedras > 0) {
                    quantidade_dinheiro += valor_uma_pedra;

                    quantidade_total_pedras --;
                }

                if (quantidade_dinheiro >= valor_aluguel) {
                    quantidade_dinheiro -= valor_aluguel;

                    meses_pagos ++;
                } else {
                    faliu = true;
                }

                mensagem += `
                    Mês 0${indice_meses}<br>
                    saldo inicial no banco R$ ${saldo_inicial} 
                    - saldo de pedras = ${quantidade_total_pedras}
                    - saldo final do banco - R$ ${quantidade_dinheiro}<br>`;

                indice_meses ++;
            }
            
            indice_anos ++;
        }

        if (faliu) {
            mensagem += `<br><br>Após ${meses_pagos} meses de aluguem você faliu!!!!`;
        } else {
            mensagem += `<br><br>Foram pagos ${meses_pagos} meses de aluguel e você ficou com R$ ${quantidade_dinheiro} no banco e ${quantidade_total_pedras} pedras de ouro`;
        }

        msg.innerHTML = mensagem;
    }
</script>
