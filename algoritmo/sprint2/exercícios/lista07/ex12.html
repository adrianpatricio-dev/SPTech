<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papagaio Falante</title>
</head>
<body>
    <h3>Papagaio Falante</h3>

    <label for="ipt_numero">Número</label> <br>
    <input type="text" id="ipt_numero"> <br>

    <label for="ipt_frase">Frase</label> <br>
    <input type="text" id="ipt_frase"> <br><br>

    <button onclick="mostrar()">PAPAGAIO</button> <br><br>
</body>
</html>

<script>
    function mostrar() {
        let numero = Number(ipt_numero.value);
        let frase = ipt_frase.value;
        
        let indice = 1;
        let indice2 = 1;
        
        let frase_repetida = '';

        while (indice <= numero) {
            frase_repetida += `${frase} `;

            indice ++;
        }

        while (indice2 <= numero) {
            alert(`${indice2}) ${frase_repetida}`);

            indice2 ++;
        }
    }
</script>
