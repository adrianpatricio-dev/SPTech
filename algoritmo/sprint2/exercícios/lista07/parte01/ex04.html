<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expressar amor</title>
</head>
<body>
    <h3>Expressar amor</h3>

    <label for="ipt_pessoaQueAma">Digite o nome de uma pessoa que ama</label> <br>
    <input type="text" id="ipt_pessoaQueAma"> <br>

    <label for="ipt_quantoAma">Digite o quanto ama (número inteiro)</label> <br>
    <input type="text" id="ipt_quantoAma"> <br><br>

    <button onclick="expressarAmor()">EXPRESSAR AMOR</button> <br><br>

    <span id="msg"></span>
</body>
</html>

<script>
    function expressarAmor() {
        let pessoaQueAma = ipt_pessoaQueAma.value;
        let quantoAma = Number(ipt_quantoAma.value);

        let indice = 1

        let mensagem = '';

        while (indice <= quantoAma) {
            mensagem += `${indice} - ${pessoaQueAma}, eu te amo! Sempre lembre disso!<br>`;

            indice ++;
        }

        msg.innerHTML = mensagem;
    }
</script>
