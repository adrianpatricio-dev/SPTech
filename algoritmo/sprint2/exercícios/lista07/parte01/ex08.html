<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Múltiplos de 5</title>
</head>
<body>
    <h3>Múltiplos de 5</h3>

    <label for="ipt_numero">Digite um número</label> <br>
    <input type="text" id="ipt_numero"> <br><br>

    <button onclick="mostrar()">ADORO MÚLTIPLOS DE 5</button> <br><br>

    <span id="msg"></span>
</body>
</html>

<script>
    function mostrar() {
        let numero = Number(ipt_numero.value);

        let indice = 1;

        let mensagem = '';

        if (numero < 20 || numero > 100) {
            msg.innerHTML = 'Número fora do intervalo (20 a 100)';
        } else {

            while (indice <= numero) {
                
                if (indice % 5 == 0) {
                    mensagem += `${indice}<br>`;
                }

                indice ++;
            }

            msg.innerHTML = mensagem;
        }
    }
</script>
