<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frase Repetitiva</title>
</head>
<body>
    <h3>Frase Repetitiva</h3>

    <button onclick="mostrar()">DIGA ALGO SOBRE A MATÉRIA DE ALGORITMOS</button> <br><br>

    <span id="msg"></span>
</body>
</html>

<script>
    function mostrar() {
        let indice = 1;

        let mensagem = '';

        while (indice <= 7) {
            mensagem += `Algoritmo é minha matéria favorita<br>`;

            indice ++;
        }

        msg.innerHTML = mensagem;
    }
</script>
