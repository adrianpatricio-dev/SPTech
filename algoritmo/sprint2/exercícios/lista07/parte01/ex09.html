<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viva o 7!</title>
</head>
<body>
    <h3>Viva o 7!</h3>

    <label for="ipt_numero">Digite um número (0 a 200)</label> <br>
    <input type="text" id="ipt_numero"> <br><br>

    <button onclick="mostrar()">VIVA O 7!</button> <br><br>

    <span id="msg"></span>
</body>
</html>

<script>
    function mostrar() {
        let numero = Number(ipt_numero.value);

        let indice = 1;

        let mensagem = '';

        if (numero < 0 || numero > 200) {
            msg.innerHTML = 'Número fora do intervalo (0 a 200)';
        } else {

            while (indice <= numero) {

                if (indice % 7 == 0) {
                    mensagem += `${indice}<br>`;
                }

                indice ++;
            }

            msg.innerHTML = mensagem;
        }
    }
</script>
