<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S2 Pares</title>
</head>
<body>
    <h3>S2 Pares</h3>

    <button onclick="mostrarPares()">S2 PARES</button> <br><br>

    <span id="msg"></span>
</body>
</html>

<script>
    function mostrarPares() {
        let indice = 1;

        let mensagem = '';

        while (indice <= 100) {

            if (indice % 2 == 0) {

                mensagem += `${indice}<br>`;

            }

            indice ++;
        }

        msg.innerHTML = mensagem;
    }
</script>
