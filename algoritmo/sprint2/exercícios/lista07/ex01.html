<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contagem Simples</title>
</head>
<body>
    <h3>Contagem Simples</h3>

    <button onclick="contar()">CONTAR</button> <br><br>

    <span id="msg"></span>
</body>
</html>

<script>
    function contar() {
        let indice = 1;
        let mensagem = '';

        while (indice <= 15) {
            mensagem += `${indice}<br>`;

            indice ++;
        }

        msg.innerHTML = mensagem;
    }
</script>
