<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auxílio Emergencial Covid-19</title>
</head>
<body>
    <h3>Auxílio Emergencial Covid-19</h3>

    <label for="ipt_renda">Digite a renda individual</label> <br>
    <input type="text" id="ipt_renda"> <br>

    <label for="ipt_rendaFamiliar">Digite a renda familiar</label> <br>
    <input type="text" id="ipt_rendaFamiliar">

    <button onclick="verificarBeneficio()">TEREI O BENEFÍCIO</button> <br><br>

    <span id="msg"></span>
</body>
</html>

<script>
    function verificarBeneficio() {
        let renda = Number(ipt_renda.value);
        let rendaFamiliar = Number(ipt_rendaFamiliar.value); 
        
        if (renda <= 2000 || rendaFamiliar <= 3000) {
            msg.innerHTML = `Você terá direito ao auxílio`;
        } else {
            msg.innerHTML = `Sem direito ao auxílio`;
        }
    }
</script>
