<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de refrigerante</title>
</head>
<body>
    <h3>Controle de refrigerante</h3>

    Digite quantas latinhas de refrigerante toma por dia <br>
    <input type="text" id="ipt_latinhasPorDia"> <br> <br>

    <button onclick="calcularRefris()">QUANTOS REFRIS?</button> <br> <br>

    <span id="msg"></span>
</body>
</html>

<script>
    function calcularRefris() {
        let latinhasPorDia = Number(ipt_latinhasPorDia.value);

        let latinhasPorAno = latinhasPorDia * 365;

        msg.innerHTML = ``;

        msg.innerHTML += `Você consome ${latinhasPorAno} por ano! <br>`;

        if (latinhasPorAno > 500) {
            msg.innerHTML += `Cuidado com a diabetes!`;
        }
    }
</script>
