<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análise da média de notas</title>
</head>
<body>
    <h3>Análise da média de notas</h3>

    <label for="ipt_nota1">Digite a nota 1</label> <br>
    <input type="text" id="ipt_nota1"> <br>

    <label for="ipt_nota2">Digite a nota 2</label> <br>
    <input type="text" id="ipt_nota2"> <br><br>

    <button onclick="verificarSituacao()">VERIFICAR SITUAÇÃO</button> <br><br>

    <span id="msg"></span>
</body>
</html>

<script>
    function verificarSituacao() {
        let nota1 = Number(ipt_nota1.value);
        let nota2 = Number(ipt_nota2.value);

        let media = (nota1 + nota2) / 2;

        if (media >= 6) {
            msg.innerHTML = `Parabéns, aprovado!`;
        } else {
            msg.innerHTML = `Tente outra vez...`;
        }
    }
</script>
