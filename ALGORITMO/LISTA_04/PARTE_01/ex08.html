<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de peso no elevador</title>
</head>
<body>
    <h3>Controle de peso no elevador</h3>

    Digite a quantidade de homens que entraram no elevador <br>
    <input type="text" id="ipt_homemElevador"> <br>

    Digite a quantidade de mulheres que entraram no elevador <br>
    <input type="text" id="ipt_mulherElevador"> <br> <br>

    <button onclick="analisarPeso()">ANALISAR PESO</button> <br> <br>

    <span id="msg"></span>
</body>
</html>

<script>
    function analisarPeso() {
        let homemElevador = Number(ipt_homemElevador.value);
        let mulherElevador = Number(ipt_mulherElevador.value);

        let totalPesoHomens = homemElevador * 80;
        let totalPesoMulheres = mulherElevador * 60;

        let totalPeso = totalPesoHomens + totalPesoMulheres;

        msg.innerHTML = ``;

        msg.innerHTML += `Este elevador suporta 800 Kg e o peso estimado desta lotação é de ${totalPeso}kg <br>`;

        if (totalPeso > 800) {
            msg.innerHTML += `Será necessário que alguém desça para que o elevador se movimente`;
        }
    }
</script>
