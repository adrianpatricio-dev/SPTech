<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fazendo divisão</title>
</head>
<body>
    Número 1
    <input type="text" id="ipt_n1"> <br> 

    Número 2
    <input type="text" id="ipt_n2"> <br> <br>

    <button onclick="calcularQuociente()">QUOCIENTE</button>
    
    <button onclick="calcularResto()">RESTO</button> 

    <button onclick="calcularCompleto()">COMPLETO</button> <br> <br>

    <span id="msg"></span>
</body>
</html>

<script>
    function calcularQuociente() {
        let n1 = Number(ipt_n1.value);
        let n2 = Number(ipt_n2.value);

        let resultado = n1 / n2;

        msg.innerHTML = `A divisão de ${n1} por ${n2} é: ${resultado}`;
    }

    function calcularResto() {
        let n1 = Number(ipt_n1.value);
        let n2 = Number(ipt_n2.value);

        let resultado = n1 % n2;

        msg.innerHTML = `O resto da divisão de ${n1} por ${n2} é: ${resultado}`;
    }

    function calcularCompleto() {
        let n1 = Number(ipt_n1.value);
        let n2 = Number(ipt_n2.value);

        let quociente = n1 / n2;

        let resto = n1 % n2;

        msg.innerHTML = `A divisão de ${n1} por ${n2} é: ${quociente} e o resto dessa divisão é: ${resto}`;
    }
</script>
