<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora básica</title>
</head>
<body>
    <h2>Calculadora Básica</h2>

    Número 1
    <input type="text" id="ipt_n1"> <br>

    Número 2
    <input type="text" id="ipt_n2"> <br> <br>

    <button onclick="somar()">SOMAR</button>
    <button onclick="subtrair()">SUBTRAÇÃO</button>
    <button onclick="multiplicar()">MULTIPLICAÇÃO</button>
    <button onclick="dividir()">DIVISÃO</button> <br> <br>

    <span id="msg"></span>
</body>
</html>

<script>
    function somar() {
        let n1 = Number(ipt_n1.value);
        let n2 = Number(ipt_n2.value);
        
        let resultado = n1 + n2;

        msg.innerHTML = `A soma entre ${n1} e ${n2} é ${resultado}`;
    }

    function subtrair() {
        let n1 = Number(n1.value);
        let n2 = Number(n2.value);
        
        let resultado = n1 - n2;

        msg.innerHTML = `A diferença entre ${n1} e ${n2} é ${resultado}`;
    }

    function subtrair() {
        let n1 = Number(n1.value);
        let n2 = Number(n2.value);
        
        let resultado = n1 * n2;

        msg.innerHTML = `O produto entre ${n1} e ${n2} é ${resultado}`;
    }

    function subtrair() {

        let n2 = Number(n2.value);
        
        let resultado = n1 / n2;

        msg.innerHTML = `A razão entre ${n1} e ${n2} é ${resultado}`;
    }
</script>
