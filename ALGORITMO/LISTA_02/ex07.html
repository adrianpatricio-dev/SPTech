<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Pet</title>
</head>
<body>
    <h1>Cadastro de Pet</h1>

    <span>Nome</span>
    <input type="text" id="input_nome"> <br>
    
    <span>Espécie</span>
    <input type="text" id="input_especie"> <br>

    <button onclick="identificarPet()">IDENTIFICAR PET</button>
</body>
</html>

<script>
    function identificarPet() {
        alert(`O seu pet se chama ${input_nome.value} e ele é um ${input_especie.value}`);
    }
</script>
