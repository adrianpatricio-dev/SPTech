<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumo de Calorias</title>
</head>
<body>
    <h3>Consumo de Calorias: Sua Dieta Está Saudável?</h3>

    <label for="ipt_paoDia">Pão francês por dia</label> <br>
    <input type="text" id="ipt_paoDia"> <br>

    <label for="ipt_bolachaDia">Pacotes de bolacha por dia</label> <br>
    <input type="text" id="ipt_bolachaDia"> <br>

    <label for="ipt_achocolatadoDia">Copos de achocolatado por dia</label> <br>
    <input type="text" id="ipt_achocolatadoDia"> <br><br>

    <button onclick="verificarCalorias()">VERIFICAR CALORIAS</button> <br><br>

    <span id="msg"></span>
</body>
</html>

<script>
    function verificarCalorias() {
        let paoDia = Number(ipt_paoDia.value);
        let bolachaDia = Number(ipt_bolachaDia.value);        
        let achocolatadoDia = Number(ipt_achocolatadoDia.value);

        let paoCalorias = paoDia * 50;

        let bolachaCalorias = bolachaDia * 80;

        let achocolatadoCalorias = achocolatadoDia * 70;

        let caloriasTotal = paoCalorias + bolachaCalorias + achocolatadoCalorias;

        if (caloriasTotal < 200) {
            msg.innerHTML = `Parabéns, vai ficar em forma !`;
        } else if (caloriasTotal <= 400) {
            msg.innerHTML = `Cuidado, vai ficar menos saudável !`;
        } else {
            msg.innerHTML = `Alerta crítico de saúde !!!`;
        }
    }
</script>
