<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análise CNH  </title>
</head>
<body>
    <h3>Análise CNH</h3>

    <label for="ipt_nome">Digite seu nome</label> <br>
    <input type="text" id="ipt_nome"> <br><br>

    <label for="ipt_idade">Digite sua idade</label> <br>
    <input type="text" id="ipt_idade"> <br><br>

    <button onclick="avaliarAluno()">AVALIAR ALUNO</button> <br><br>

    <span id="msg"></span>
</body>
</html>

<script>
    function avaliarAluno() {
        let nome = ipt_nome.value;
        let idade = Number(ipt_idade.value);

        if (idade >= 18) {
            msg.innerHTML = `${nome}, vamos tirar a CNH?`;
        } else {
            msg.innerHTML = `${nome}, vai jogar PlayStation!`;
        }
    }
</script>
