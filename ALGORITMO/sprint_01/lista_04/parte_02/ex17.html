<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de divisibilidade</title>
</head>
<body>
    <label for="ipt_n1">Digite o primeiro número</label> <br>
    <input type="text" id="ipt_n1"> <br>

    <label for="ipt_n2">Digite o segundo número</label> <br>
    <input type="text" id="ipt_n2"> <br><br>

    <button onclick="testar()">TESTAR</button> <br><br>

    <span id="msg"></span>
</body>
</html>

<script>
    function testar() {
        let n1 = Number(ipt_n1.value);            
        let n2 = Number(ipt_n2.value);
        
        let divisao = n1 / n2;

        divisao %= 2;

        if (divisao == 0) {
            msg.innerHTML = `<img src="https://media.istockphoto.com/id/1175303918/pt/vetorial/like-icon-vector-design.jpg?s=612x612&w=0&k=20&c=DyYQuKuWJ4fuUhyO7AaXAr_JQaUuPJgFD9DiOLNkigs=" style="width="100px"; height="100px;"">`;
        } else {
            msg.innerHTML = `<img src="https://static.vecteezy.com/ti/vetor-gratis/t1/72222483-negativo-comentarios-simbolo-mostrando-desaprovacao-e-rejeicao-dentro-uma-silhueta-estilo-vetor.jpg" style="width=" 100px"; height="100px;"">`;
        }
    }
</script>
