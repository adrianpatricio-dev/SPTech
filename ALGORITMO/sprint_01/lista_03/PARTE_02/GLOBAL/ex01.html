<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar saldo bancário</title>
</head>
<body>
    <span id="msg"></span> <br> <br>

    <button onclick="receber()">RECEBER 100</button>

    <button onclick="pagar()">PAGAR 50</button>
</body>
</html>

<script>
    let saldo = 0;

    function receber() {
        saldo = saldo + 100;

        msg.innerHTML = `Transferência de R$100 recebida! Saldo atual: R$${saldo}`;
    }

    function pagar() {
        saldo = saldo - 50;

        msg.innerHTML = `Transferência de R$100 recebida! Saldo atual: R$${saldo}`;
    }
</script>
