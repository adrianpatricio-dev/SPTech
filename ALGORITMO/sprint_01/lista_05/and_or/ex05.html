<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação do Clima</title>
</head>
<body>
    <h3>Avaliação do Clima: Está Agradável ou Desconfortável?</h3>

    <label for="ipt_temperatura">Temperatura</label> <br>
    <input type="text" id="ipt_temperatura"> <br>

    <label for="ipt_umidade">Umidade do ar</label> <br>
    <input type="text" id="ipt_umidade"> <br>

    <button onclick="avaliarClima()">AVALIAR CLIMA</button> <br><br>

    <span id="msg"></span>
</body>
</html>

<script>
    function avaliarClima() {
        let temperatura = Number(ipt_temperatura.value);
        let umidade = Number(ipt_umidade.value);


        if (temperatura != '' && umidade != '') {

            if (umidade < 0 || umidade > 100) {
                alert('Valor de umidade inválido');

                msg.innerHTML = '';
            } else if ((temperatura >= 22 || temperatura <= 23) && umidade < 60) {
                msg.innerHTML = `Clima agradável`;
            } else {
                msg.innerHTML = `Clima desconfortável`;
            }

        } else {
            msg.innerHTML = `Preencha os campos`;
        }
    }
</script>
