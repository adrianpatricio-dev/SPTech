<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processo Seletivo</title>
</head>
<body>
    <h3>Processo Seletivo: Vestibular ou ENEM?</h3>

    <label for="ipt_vestibular">Nota do vestibular interno</label> <br>
    <input type="text" id="ipt_vestibular"> <br>

    <label for="ipt_enem">Nota do ENEM</label> <br>
    <input type="text" id="ipt_enem"> <br>

    <label for="ipt_redacao">Nota da redação</label> <br>
    <input type="text" id="ipt_redacao"> <br><br>

    <button onclick="verificarAprovacao()">VERIFICAR APROVAÇÃO</button> <br><br>

    <span id="msg"></span>
</body>
</html>

<script>
    function verificarAprovacao() {
        let vestibular = ipt_vestibular.value;
        let enem = ipt_enem.value;
        let redacao = ipt_redacao.value;

        if (vestibular == '' || enem == '' || redacao == '') {
            msg.innerHTML = `Preencha os campos`;
        } else if (vestibular >= 700 || (enem >= 650 && redacao > 0)) {
            alert(`Aprovado!`);
        } else {
            alert(`Não aprovado`);
        }
    }
</script>
