<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conforto térmico</title>
</head>
<body>
    <h3>Conforto térmico: a temperatura está ideal?</h3>
    
    <label for="ipt_temperatura">Temperatura</label> <br>
    <input type="text" id="ipt_temperatura">  <br><br>

    <button onclick="verSituacao()">VER SITUAÇÃO</button>
</body>
</html>

<script>
    function verSituacao() {
        let temperatura = Number(ipt_temperatura.value);

        if (temperatura >= 21 && temperatura <= 24) {
            alert('Temperatura confortável :D');
        } else {
            alert('Temperatura DESCONFORTÁVEL :C');
        }
    }
</script>
