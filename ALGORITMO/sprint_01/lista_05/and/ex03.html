<!DOCTYPE html>
<html lang="pt-br>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação de Notas</title>
</head>
<body>
    <h3>Validação de Notas: Seu Resultado é Aceitável?</h3>

    <label for="ipt_nota">Digite uma nota</label> <br>
    <input type="text" id="ipt_nota"> <br><br>

    <button onclick="avaliarAluno()">AVALIAR ALUNO</button>
</body>
</html>

<script>
    function avaliarAluno() {
        let nota = Number(ipt_nota.value);

        if (nota >= 0 && nota <= 10) {
            alert('Nota válida!');
        } else {
            alert('Onde já se viu nota menor que 0 e maior que 10?!');
        }
    }
</script>
